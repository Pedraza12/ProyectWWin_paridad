# Plantilla de nginx para el contenedor (SPA + API en el mismo origen).
# docker/entrypoint.sh sustituye ${PORT} por el puerto que asigna Railway.

server {
    listen ${PORT} default_server;
    server_name _;

    root /app/public;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    # Compresión para el SPA (los assets ya vienen con hash en el nombre).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Healthcheck de Railway (ruta Laravel /up) ----
    location = /up {
        include fastcgi_params;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    # ---- API Laravel y cookie CSRF de Sanctum ----
    location ^~ /v1 {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /sanctum {
        try_files $uri /index.php?$query_string;
    }

    # ---- Entrada PHP (destino de los rewrites internos) ----
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    # ---- Assets de Vite (nombre con hash: cache de un año) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Compatibilidad: nombre anterior del APK ----
    # El archivo público ahora es ProyecTWin.apk, pero se conserva la URL
    # anterior para instalaciones que aún la tengan en caché.
    location = /apk/proyecttwin.apk {
        alias /app/public/apk/ProyecTWin.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="ProyecTWin.apk"';
    }

    # El index.html nunca se cachea: siempre debe apuntar a los assets vigentes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- SPA con fallback para las rutas del cliente (React Router) ----
    location / {
        try_files $uri /index.html;
    }

    # No exponer archivos ocultos (.env, .git, …)
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
